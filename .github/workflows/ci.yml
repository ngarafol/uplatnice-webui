name: CI

# Testovi i provjera da se slika izgradi — bez pushanja.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Izgradi sliku (bez pusha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile # buildx ne prepoznaje Containerfile sam
          push: false
          tags: uplatnice-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
